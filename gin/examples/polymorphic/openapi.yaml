openapi: 3.1.0
info:
  title: Polymorphic API Example
  description: A comprehensive example demonstrating polymorphic types with the Gin Call method
  version: 1.0.0
paths:
  /animals:
    post:
      tags:
        - animals
      summary: Create a new animal
      description: Creates a new animal with polymorphic input supporting dogs, cats, and birds
      parameters:
        - name: source
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    breed:
                      type: string
                    name:
                      type: string
                    isGood:
                      type: boolean
                  required:
                    - breed
                    - name
                    - isGood
                - type: object
                  properties:
                    lives:
                      type: integer
                      format: int32
                    name:
                      type: string
                    color:
                      type: string
                  required:
                    - lives
                    - name
                    - color
                - type: object
                  properties:
                    canFly:
                      type: boolean
                    name:
                      type: string
                    species:
                      type: string
                    wingspan:
                      type: integer
                      format: int32
                  required:
                    - canFly
                    - name
                    - species
                    - wingspan
              discriminator:
                propertyName: animalType
                mapping:
                  bird: '#/components/schemas/polymorphic.v1.Bird'
                  cat: '#/components/schemas/polymorphic.v1.Cat'
                  dog: '#/components/schemas/polymorphic.v1.Dog'
                defaultMapping: dog
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/polymorphic.v1.AnimalResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        description: always "error"
                      type:
                        type: string
                        description: error type, e.g. "validation", "internal", etc.
                      message:
                        type: string
                        description: general error message
                      fields:
                        type: object
                        additionalProperties:
                          type: string
                        description: validation messages per field
                    required:
                      - status
                      - type
                      - message
                    description: ErrorResponse represents the standard error response format.
                  - type: object
                    properties:
                      field:
                        type: string
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - field
                      - code
                      - message
                    description: Validation error response
                  - type: object
                    properties:
                      errorCode:
                        type: string
                      details:
                        type: string
                      suggestedAction:
                        type: string
                    required:
                      - errorCode
                      - details
                      - suggestedAction
                    description: Business logic error response
                  - type: object
                    properties:
                      component:
                        type: string
                      severity:
                        type: string
                      message:
                        type: string
                    required:
                      - component
                      - severity
                      - message
                    description: System error response
  /animals/{id}:
    get:
      tags:
        - animals
      summary: Get an animal by ID
      description: Retrieves an animal by its unique identifier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  createdAt:
                    type: string
                required:
                  - id
                  - createdAt
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        description: always "error"
                      type:
                        type: string
                        description: error type, e.g. "validation", "internal", etc.
                      message:
                        type: string
                        description: general error message
                      fields:
                        type: object
                        additionalProperties:
                          type: string
                        description: validation messages per field
                    required:
                      - status
                      - type
                      - message
                    description: ErrorResponse represents the standard error response format.
                  - type: object
                    properties:
                      field:
                        type: string
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - field
                      - code
                      - message
                    description: Validation error response
    put:
      tags:
        - animals
      summary: Update an animal
      description: Updates an existing animal with polymorphic input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/polymorphic.v1.UpdateAnimalRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/polymorphic.v1.AnimalResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/polymorphic.v1.ValidationError'
  /vehicles:
    post:
      tags:
        - vehicles
      summary: Create a new vehicle
      description: Creates a new vehicle with polymorphic input using component references
      parameters:
        - name: owner
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/polymorphic.v1.CreateVehicleRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/polymorphic.v1.VehicleResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/polymorphic.v1.ValidationError'
  /vehicles/{id}:
    get:
      tags:
        - vehicles
      summary: Get a vehicle by ID
      description: Retrieves a vehicle by its unique identifier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  createdAt:
                    type: string
                  status:
                    type: string
                required:
                  - id
                  - createdAt
                  - status
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        description: always "error"
                      type:
                        type: string
                        description: error type, e.g. "validation", "internal", etc.
                      message:
                        type: string
                        description: general error message
                      fields:
                        type: object
                        additionalProperties:
                          type: string
                        description: validation messages per field
                    required:
                      - status
                      - type
                      - message
                    description: ErrorResponse represents the standard error response format.
                  - type: object
                    properties:
                      field:
                        type: string
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - field
                      - code
                      - message
                    description: Validation error response
components:
  schemas:
    polymorphic.v1.ValidationError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
        - field
        - code
        - message
      description: Validation error response
    polymorphic.v1.BusinessError:
      type: object
      properties:
        errorCode:
          type: string
        details:
          type: string
        suggestedAction:
          type: string
      required:
        - errorCode
        - details
        - suggestedAction
      description: Business logic error response
    polymorphic.v1.SystemError:
      type: object
      properties:
        component:
          type: string
        severity:
          type: string
        message:
          type: string
      required:
        - component
        - severity
        - message
      description: System error response
    polymorphic.v1.AnimalResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
      required:
        - id
        - createdAt
    polymorphic.v1.Dog:
      type: object
      properties:
        breed:
          type: string
        name:
          type: string
        isGood:
          type: boolean
      required:
        - breed
        - name
        - isGood
    polymorphic.v1.Cat:
      type: object
      properties:
        lives:
          type: integer
          format: int32
        name:
          type: string
        color:
          type: string
      required:
        - lives
        - name
        - color
    polymorphic.v1.Bird:
      type: object
      properties:
        canFly:
          type: boolean
        name:
          type: string
        species:
          type: string
        wingspan:
          type: integer
          format: int32
      required:
        - canFly
        - name
        - species
        - wingspan
    polymorphic.v1.Animal:
      oneOf:
        - type: object
          properties:
            breed:
              type: string
            name:
              type: string
            isGood:
              type: boolean
          required:
            - breed
            - name
            - isGood
        - type: object
          properties:
            lives:
              type: integer
              format: int32
            name:
              type: string
            color:
              type: string
          required:
            - lives
            - name
            - color
        - type: object
          properties:
            canFly:
              type: boolean
            name:
              type: string
            species:
              type: string
            wingspan:
              type: integer
              format: int32
          required:
            - canFly
            - name
            - species
            - wingspan
      discriminator:
        propertyName: animalType
        mapping:
          bird: '#/components/schemas/polymorphic.v1.Bird'
          cat: '#/components/schemas/polymorphic.v1.Cat'
          dog: '#/components/schemas/polymorphic.v1.Dog'
        defaultMapping: dog
    polymorphic.v1.UpdateAnimalRequest:
      oneOf:
        - type: object
          properties:
            breed:
              type: string
            name:
              type: string
            isGood:
              type: boolean
          required:
            - breed
            - name
            - isGood
        - type: object
          properties:
            lives:
              type: integer
              format: int32
            name:
              type: string
            color:
              type: string
          required:
            - lives
            - name
            - color
        - type: object
          properties:
            canFly:
              type: boolean
            name:
              type: string
            species:
              type: string
            wingspan:
              type: integer
              format: int32
          required:
            - canFly
            - name
            - species
            - wingspan
      discriminator:
        propertyName: animalType
        mapping:
          bird: '#/components/schemas/polymorphic.v1.Bird'
          cat: '#/components/schemas/polymorphic.v1.Cat'
          dog: '#/components/schemas/polymorphic.v1.Dog'
        defaultMapping: dog
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: always "error"
        type:
          type: string
          description: error type, e.g. "validation", "internal", etc.
        message:
          type: string
          description: general error message
        fields:
          type: object
          additionalProperties:
            type: string
          description: validation messages per field
      required:
        - status
        - type
        - message
      description: ErrorResponse represents the standard error response format.
    polymorphic.v1.Car:
      type: object
      properties:
        doors:
          type: integer
          format: int32
        brand:
          type: string
        model:
          type: string
      required:
        - doors
        - brand
        - model
    polymorphic.v1.Truck:
      type: object
      properties:
        capacity:
          type: integer
          format: int32
        brand:
          type: string
        axleType:
          type: string
      required:
        - capacity
        - brand
        - axleType
    polymorphic.v1.Motorcycle:
      type: object
      properties:
        ccs:
          type: integer
          format: int32
        brand:
          type: string
        type:
          type: string
      required:
        - ccs
        - brand
        - type
    polymorphic.v1.CreateVehicleRequest:
      oneOf:
        - $ref: '#/components/schemas/polymorphic.v1.Car'
        - $ref: '#/components/schemas/polymorphic.v1.Truck'
        - $ref: '#/components/schemas/polymorphic.v1.Motorcycle'
      discriminator:
        propertyName: vehicleType
        mapping:
          car: '#/components/schemas/polymorphic.v1.Car'
          motorcycle: '#/components/schemas/polymorphic.v1.Motorcycle'
          truck: '#/components/schemas/polymorphic.v1.Truck'
        defaultMapping: car
    polymorphic.v1.VehicleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
        status:
          type: string
      required:
        - id
        - createdAt
        - status
    polymorphic.v1.Vehicle:
      oneOf:
        - $ref: '#/components/schemas/polymorphic.v1.Car'
        - $ref: '#/components/schemas/polymorphic.v1.Truck'
        - $ref: '#/components/schemas/polymorphic.v1.Motorcycle'
      discriminator:
        propertyName: vehicleType
        mapping:
          car: '#/components/schemas/polymorphic.v1.Car'
          motorcycle: '#/components/schemas/polymorphic.v1.Motorcycle'
          truck: '#/components/schemas/polymorphic.v1.Truck'
        defaultMapping: car
